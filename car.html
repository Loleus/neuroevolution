<!DOCTYPE html>
<html>
<head>
    <title>Car (fixed)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; touch-action: none; font-family: sans-serif; }
        #controls {
            position: absolute; bottom: 20px; width: 100%;
            display: flex; justify-content: space-around; pointer-events: none;
        }
        #ui-top {
            position: absolute; top: 20px; right: 20px; pointer-events: none;
        }
        .btn {
            width: 65px; height: 65px; background: rgba(0, 0, 0, 0.6);
            border: 2px solid #fff; border-radius: 12px; display: flex;
            align-items: center; justify-content: center; font-weight: bold;
            color: white; user-select: none; pointer-events: auto; cursor: pointer;
        }
        .btn-small { width: 80px; height: 40px; font-size: 12px; }
        .active { background: rgba(255, 255, 255, 0.8); color: black; }
        
        /* --- SPEEDOMETER UI --- */
        #speedometer-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 5px;
            padding: 12px 20px;
            color: white;
            min-width: 100px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: none;
            user-select: none;
        }
        .speed-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
            margin-bottom: 2px;
        }
        .speed-value {
            font-size: 32px;
            font-weight: 900;
            font-family: monospace;
            color: #ffc;
            display: inline-block;
        }
        .speed-unit {
            font-size: 14px;
            color: #fff;
            margin-left: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Speedometer HUD -->
    <div id="speedometer-container">
        <div class="speed-label">Speed</div>
        <div>
            <span id="speed-num" class="speed-value">0</span>
            <span class="speed-unit">KM/H</span>
        </div>
    </div>
    
    <div id="controls">
        <div style="display:flex; gap: 15px;">
            <div id="btn-left" class="btn">←</div>
            <div id="btn-right" class="btn">→</div>
        </div>
        <div style="display:flex; gap: 15px;">
            <div id="btn-rev" class="btn">B</div>
            <div id="btn-gas" class="btn">GAS</div>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- Place / Scene Setup --- //
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 100, 500);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(20, 50, 20);
        scene.add(light, new THREE.AmbientLight(0xffffff, 0.5));

        // --- AUDIO SYNTHESIZER SETUP ---
        const audioListener = new THREE.AudioListener();
        camera.add(audioListener);

        let audioCtxInitialized = false;
        let engineOsc, engineGain, driftOsc, driftGain;

        function initAudio() {
            if (audioCtxInitialized) return;
            
            const ctx = audioListener.context;
            if (ctx.state === 'suspended') ctx.resume();

            // 1. Engine Sound Synthesizer
            engineOsc = ctx.createOscillator();
            engineGain = ctx.createGain();
            engineOsc.type = 'sawtooth';
            engineOsc.frequency.value = 40; 
            engineGain.gain.value = 0.05;    
            
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 300;

            engineOsc.connect(filter);
            filter.connect(engineGain);
            engineGain.connect(ctx.destination);
            engineOsc.start(0);

            // 2. Drift/Screech Sound Synthesizer
            driftOsc = ctx.createOscillator();
            driftGain = ctx.createGain();
            driftOsc.type = 'triangle';
            driftOsc.frequency.value = 400; 
            driftGain.gain.value = 0; 

            const driftFilter = ctx.createBiquadFilter();
            driftFilter.type = 'bandpass';
            driftFilter.frequency.value = 800;

            driftOsc.connect(driftFilter);
            driftFilter.connect(driftGain);
            driftGain.connect(ctx.destination);
            driftOsc.start(0);

            audioCtxInitialized = true;
            const prompt = document.getElementById('audio-prompt');
            if(prompt) prompt.style.display = 'none';
        }

        // --- MULTIPLE WARNING SIGNS ---
        const signData = [
            { text: "Turn back bro", z: 600, x: 8, rot: 0.2 },
            { text: "I told ya", z: 930, x: 8, rot: 0.2 },
            { text: "Nahhh back", z: -600, x: -8, rot: 0.2 },
            { text: "nothing here", z: -930, x: -8, rot: 0.2 }
        ];

        function createSign(data) {
            const group = new THREE.Group();
            
            const post = new THREE.Mesh(new THREE.BoxGeometry(0.3, 4, 0.2), new THREE.MeshStandardMaterial({color: 0x4b3621}));
            post.position.y = 2;
            group.add(post);

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512; canvas.height = 256;
            ctx.fillStyle = '#8b4513';
            ctx.fillRect(0, 0, 512, 256);
            ctx.strokeStyle = '#331a00'; ctx.lineWidth = 15; ctx.strokeRect(0, 0, 512, 256);
            ctx.fillStyle = 'white';
            ctx.font = 'Bold 55px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(data.text, 256, 145);

            const texture = new THREE.CanvasTexture(canvas);
            const board = new THREE.Mesh(
                new THREE.BoxGeometry(5, 2, 0.3),
                new THREE.MeshStandardMaterial({ map: texture })
            );
            board.position.y = 4;
            group.add(board);

            group.position.set(data.x, 0, data.z);
            group.rotation.y = data.rot;
            scene.add(group);
        }

        signData.forEach(data => createSign(data));

        // --- Environment Objects ---
        const grass = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshStandardMaterial({ color: 0x567d46 }));
        grass.rotation.x = -Math.PI / 2;
        scene.add(grass);

        const road = new THREE.Mesh(new THREE.PlaneGeometry(14, 2000), new THREE.MeshStandardMaterial({ color: 0x333333 }));
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0.02;
        scene.add(road);
        
        const lineGeo = new THREE.PlaneGeometry(0.5, 4);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for (let i = 0; i < 100; i++) {
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.set(0, 0.03, -1000 + (i * 20)); 
            scene.add(line);
        }
        
        function createHouse() {
            const house = new THREE.Group();
            const colors = [0x9e7b5a, 0x8b4513, 0xcccccc, 0x708090];
            const baseColor = colors[Math.floor(Math.random() * colors.length)];

            const walls = new THREE.Mesh(new THREE.BoxGeometry(6, 5, 6), new THREE.MeshStandardMaterial({color: baseColor}));
            walls.position.y = 2.5;
            
            const roof = new THREE.Mesh(new THREE.ConeGeometry(5.5, 4, 4), new THREE.MeshStandardMaterial({color: 0x8b0000}));
            roof.position.y = 6.5;
            roof.rotation.y = Math.PI / 4;

            const door = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 0.1), new THREE.MeshStandardMaterial({color: 0x331a00}));
            door.position.set(0, 1.1, 3.01);

            house.add(walls, roof, door);
            return house;
        }

        for(let i=0; i<100; i++) {
            const side = Math.random() > 0.5 ? 1 : -1;
            const x = (25 + Math.random() * 60) * side;
            const z = (Math.random() - 0.5) * 1000;

            if (i % 3 === 0) {
                const h = createHouse();
                h.position.set(x, 0, z);
                h.rotation.y = side > 0 ? -Math.PI/2 : Math.PI/2;
                scene.add(h);
            }

            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 2), new THREE.MeshStandardMaterial({color: 0x4b3621}));
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(2, 4, 4), new THREE.MeshStandardMaterial({color: 0x2d5e32}));
            leaves.position.y = 2.5;
            tree.add(trunk, leaves);
            tree.position.set(x - (10 * side), 1, z + 10);
            scene.add(tree);
        }

        const mtnMat = new THREE.MeshStandardMaterial({ color: 0x808080, roughness: 0.9, flatShading: true });
        for (let i = 0; i < 20; i++) {
            const h = 50 + Math.random() * 50;
            const radius = 30 + Math.random() * 20;
            const geo = new THREE.ConeGeometry(radius, h, 4); 
            const mtn = new THREE.Mesh(geo, mtnMat);
            
            const x = (Math.random() - 0.5) * 800;
            if (x > 0) mtn.position.x = x + 100;
            else mtn.position.x = x - 100;

            mtn.position.y = h / 2;
            mtn.position.z = -500 + Math.random() * 500; 
            scene.add(mtn);
        }
        
        const clouds = [];
        const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
        const cloudGeo = new THREE.SphereGeometry(1, 8, 8);
        
        for (let i = 0; i < 50; i++) {
            const cloudGroup = new THREE.Group();
            for(let j=0; j<5; j++) {
                const puff = new THREE.Mesh(cloudGeo, cloudMat);
                puff.position.set(j * 1.5, Math.random(), Math.random());
                puff.scale.set(3, 1.5, 2);
                cloudGroup.add(puff);
            }
            cloudGroup.position.set(Math.random()*400 - 200, 40 + Math.random()*80, Math.random()*1000 - 500);
            scene.add(cloudGroup);
            clouds.push(cloudGroup);
        }

        // --- The Car ---
        const car = new THREE.Group();
        const paint = new THREE.MeshStandardMaterial({color: 0x1772b3});
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, transparent: true, opacity: 0.6, side: THREE.DoubleSide });

        const body = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.6, 4.2), paint);
        body.position.y = 0.6;
        const hood = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.8, 1.1), paint);
        hood.position.set(0, 1.05, 0.9); hood.rotation.x = 0.8;
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.9, 2.1), paint);
        cabin.position.set(0, 1.25, -0.3);
        const trunk = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.8, 1.1), paint);
        trunk.position.set(0, 1.05, -1.4); trunk.rotation.x = -0.8;
        car.add(body, hood, cabin, trunk);
        
        const frontWinShape = new THREE.Shape();
        frontWinShape.moveTo(-0.9, -0.3); 
        frontWinShape.lineTo(-0.05, -0.3); 
        frontWinShape.lineTo(-0.05, 0.3);  
        frontWinShape.lineTo(-0.6, 0.3);  
        
        const rearWinShape = new THREE.Shape();
        rearWinShape.moveTo(0.05, -0.3);  
        rearWinShape.lineTo(0.9, -0.3);   
        rearWinShape.lineTo(0.6, 0.3);    
        rearWinShape.lineTo(0.05, 0.3);   

        const frontWinGeo = new THREE.ShapeGeometry(frontWinShape);
        const rearWinGeo = new THREE.ShapeGeometry(rearWinShape);

        const addSideWindows = (side) => {
            const xPos = side === 'left' ? -0.91 : 0.91;
            const rotY = side === 'left' ? Math.PI / 2 : -Math.PI / 2;

            const fWin = new THREE.Mesh(frontWinGeo, glassMat);
            fWin.position.set(xPos, 1.25, -0.2);
            fWin.rotation.y = rotY;
            car.add(fWin);

            const rWin = new THREE.Mesh(rearWinGeo, glassMat);
            rWin.position.set(xPos, 1.25, -0.2);
            rWin.rotation.y = rotY;
            car.add(rWin);
        };

        addSideWindows('left');
        addSideWindows('right');

        const frontWin = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.8), glassMat);
        frontWin.position.set(0, 1.35, 1.2); frontWin.rotation.x = 15;
        car.add(frontWin);

        const backWin = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.8), glassMat);
        backWin.position.set(0, 1.35, -1.7); backWin.rotation.x = -15;
        car.add(backWin);
        
        const headLightGeo = new THREE.PlaneGeometry(0.5, 0.25);
        const headLightMat = new THREE.MeshBasicMaterial({ color: 0xb8b800 });
        const hl = new THREE.Mesh(headLightGeo, headLightMat);
        hl.position.set(-0.6, 0.6, 2.11); car.add(hl);
        const hr = hl.clone(); hr.position.x = 0.6; car.add(hr);

        const lightGeo = new THREE.PlaneGeometry(0.5, 0.25);
        const lightMat = new THREE.MeshStandardMaterial({ 
            color: 0xff0000, 
            emissive: 0xff0000, 
            emissiveIntensity: 0.1 
        });
        const leftLight = new THREE.Mesh(lightGeo, lightMat);
        leftLight.position.set(-0.6, 0.6, -2.11);
        leftLight.rotation.y = Math.PI; 
        
        const rightLight = leftLight.clone();
        rightLight.position.x = 0.6;
        car.add(leftLight, rightLight);

        // --- WHEELS & RIMS ---
        const wheels = [];
        const tireGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.2, 20);
        tireGeo.rotateZ(Math.PI / 2);
        const rimGeo = new THREE.CylinderGeometry(0.20, 0.20, 0.2, 16); 
        rimGeo.rotateZ(Math.PI / 2);
        const capGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.2, 8); 
        capGeo.rotateZ(Math.PI / 2);

        const tireMat = new THREE.MeshStandardMaterial({color: 0x111111});
        const rimMat = new THREE.MeshStandardMaterial({color: 0x888888, metalness: 0.6, roughness: 0.4});
        const capMat = new THREE.MeshStandardMaterial({color: 0xcccccc, metalness: 0.8});

        const spawnWheel = (x, z, id) => {
            const group = new THREE.Group();
            const tire = new THREE.Mesh(tireGeo, tireMat);
            const rim = new THREE.Mesh(rimGeo, rimMat);
            const cap = new THREE.Mesh(capGeo, capMat);
            
            group.add(tire, rim, cap);
            group.position.set(x, 0.38, z);
            car.add(group);
            return { group, tire, id };
        };

        wheels.push(
            spawnWheel(-0.95, 1.3, 'fl'), spawnWheel(0.95, 1.3, 'fr'),
            spawnWheel(-0.95, -1.3, 'rl'), spawnWheel(0.95, -1.3, 'rr')
        );
        scene.add(car);
    
        const exhaustPipe = new THREE.Mesh(
            new THREE.CylinderGeometry(0.1, 0.1, 0.5, 8),
            new THREE.MeshStandardMaterial({color: 0x444444, metalness: 0.8})
        );
        exhaustPipe.rotation.x = Math.PI / 2;
        exhaustPipe.position.set(0.6, 0.35, -2.1); 
        car.add(exhaustPipe);

        // --- Smoke ---
        const smokeParticles = [];
        const smokeGeo = new THREE.SphereGeometry(0.2, 6, 6);
        const smokeMat = new THREE.MeshBasicMaterial({ color: 0x999999, transparent: true, opacity: 0.1 });

        function createSmoke() {
            const p = new THREE.Mesh(smokeGeo, smokeMat.clone());
            const vector = new THREE.Vector3(0.6, 0.35, -2.3);
            vector.applyMatrix4(car.matrixWorld);
            p.position.copy(vector);
            p.life = 1.0; 
            scene.add(p);
            smokeParticles.push(p);
        }

        // --- LICENSE PLATE ---
        const plateCanvas = document.createElement('canvas');
        plateCanvas.width = 128; plateCanvas.height = 64;
        const plateCtx = plateCanvas.getContext('2d');
        plateCtx.fillStyle = '#FFFFFF'; plateCtx.fillRect(0, 0, 128, 64);
        plateCtx.lineWidth = 4; plateCtx.strokeStyle = '#333333'; plateCtx.strokeRect(0, 0, 128, 64);
        plateCtx.fillStyle = '#000000'; plateCtx.font = 'bold 25px sans-serif'; plateCtx.textAlign = 'center';
        plateCtx.fillText('A 277 BA', 64, 46);

        const plateTexture = new THREE.CanvasTexture(plateCanvas);
        plateTexture.repeat.x = -1;
        plateTexture.offset.x = 1;
        
        const plateMaterial = new THREE.MeshStandardMaterial({ map: plateTexture, side: THREE.DoubleSide });
        const plateGeometry = new THREE.PlaneGeometry(0.6, 0.3);
        const rearPlate = new THREE.Mesh(plateGeometry, plateMaterial);
        rearPlate.position.set(0, 0.5, -2.12);
        car.add(rearPlate);

        // --- SKID MARKS CONFIG ---
        const skidsTracked = []; // Consolidated naming variable
        const maxSkids = 1000; 
        const skidGeometry = new THREE.PlaneGeometry(0.25, 0.4); 
        skidGeometry.rotateX(-Math.PI / 2); 
        const skidMaterial = new THREE.MeshBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.4 });

        function makeSkidSegment(wheelObj) {
            const segment = new THREE.Mesh(skidGeometry, skidMaterial);
            const wheelWorldPos = new THREE.Vector3();
            wheelObj.group.getWorldPosition(wheelWorldPos);
            
            segment.position.set(wheelWorldPos.x, 0.04, wheelWorldPos.z);
            segment.rotation.y = car.rotation.y;
            
            scene.add(segment);
            skidsTracked.push(segment);

            if(skidsTracked.length > maxSkids) {
                const old = skidsTracked.shift();
                scene.remove(old);
                old.geometry.dispose();
            }
        }

        // --- INPUT INTERFACES ---
        const input = { gas: false, rev: false, left: false, right: false };
        function bind(id, prop) {
            const el = document.getElementById(id);
            const set = (v) => (e) => { 
                e.preventDefault(); 
                initAudio(); // Initialize audio context on touch/click gesture too
                input[prop] = v; 
                v ? el.classList.add('active') : el.classList.remove('active'); 
            };

            el.addEventListener('touchstart', set(true)); 
            el.addEventListener('touchend', set(false));
            el.addEventListener('mousedown', set(true)); 
            el.addEventListener('mouseup', set(false));
        }

        bind('btn-gas', 'gas'); bind('btn-rev', 'rev'); bind('btn-left', 'left'); bind('btn-right', 'right');

        const speedNumEl = document.getElementById('speed-num');

        window.addEventListener('keydown', (e) => {
            initAudio();
            if(e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') input.gas = true;
            if(e.key === 'ArrowDown' || e.key.toLowerCase() === 's') input.rev = true;
            if(e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') input.left = true;
            if(e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') input.right = true;
        });

        window.addEventListener('keyup', (e) => {
            if(e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') input.gas = false;
            if(e.key === 'ArrowDown' || e.key.toLowerCase() === 's') input.rev = false;
            if(e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') input.left = false;
            if(e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') input.right = false;
        });

        // --- ANIMATION LOOP ---
        let speed = 0, angle = 0, smokeTimer = 0;

        function animate() {
            requestAnimationFrame(animate);

          // Cloud wind & infinite looping relative to the car
clouds.forEach(c => {
    c.position.x += 0.05; // Move them forward with the wind

    // If a cloud gets too far ahead/behind the car on the Z axis, snap it back
    if (c.position.z - car.position.z > 500) c.position.z -= 1000;
    if (c.position.z - car.position.z < -500) c.position.z += 1000;

    // If a cloud gets too far to the right/left of the car on the X axis, wrap it around
    if (c.position.x - car.position.x > 300) c.position.x -= 300;
    if (c.position.x - car.position.x < -300) c.position.x += 300;
});
            // Physics & Movement
            if(input.gas) speed += 0.015;
            if(input.rev) speed -= 0.01;
            if(input.left) angle += 0.04;
            if(input.right) angle -= 0.04;

            speed *= 0.96; // Drag/friction Coefficient

            car.rotation.y = angle;
            car.position.x += Math.sin(angle) * speed;
            car.position.z += Math.cos(angle) * speed;

            // --- AUDIO REAL-TIME CALCULATIONS ---
            if (audioCtxInitialized) {
                const absSpeed = Math.abs(speed);
                
                engineOsc.frequency.value = 40 + (absSpeed * 220); 
                engineGain.gain.value = input.gas ? 0.08 : 0.04;  

                const isTurning = input.left || input.right;
                if (isTurning && absSpeed > 0.15) {
                    driftGain.gain.value = THREE.MathUtils.lerp(driftGain.gain.value, 0.03, 0.2);
                    driftOsc.frequency.value = 500 + (Math.random() * 80); 
                } else {
                    driftGain.gain.value = THREE.MathUtils.lerp(driftGain.gain.value, 0, 0.15);
                }
            }
                  
            // --- Skid Mark Trigger Logic ---
            const isTurningHard = (input.left || input.right) && Math.abs(speed) > 0.15;
            const isBraking = (input.rev && speed > 0.1);
            
            if (isTurningHard || isBraking) {
                wheels.forEach(w => {
                    if(w.id.includes('r')) {
                        makeSkidSegment(w);
                    }
                });
            }
            
            // Speed HUD calculation
            let displaySpeed = Math.round(Math.abs(speed) * 150);
            speedNumEl.textContent = displaySpeed;

            // Smoke logic
            smokeTimer++;
            const smokeInterval = input.gas ? 3 : 10; 
            if(smokeTimer > smokeInterval) {
                createSmoke();
                smokeTimer = 0;
            }

            // Update Smoke Particles
            for(let i = smokeParticles.length - 1; i >= 0; i--) {
                const p = smokeParticles[i];
                p.life -= 0.02;
                p.position.y += 0.02; 
                p.position.x += 0.01; 
                p.scale.multiplyScalar(1.0); 
                p.material.opacity = p.life;
                
                if(p.life <= 0) {
                    scene.remove(p);
                    smokeParticles.splice(i, 1);
                }
            }

            // Update Wheels
            wheels.forEach(w => {
                w.group.children.forEach(m => m.rotation.x += speed * 2.5);
                if(w.id.includes('f')) {
                    const target = input.left ? 0.45 : (input.right ? -0.45 : 0);
                    w.group.rotation.y = THREE.MathUtils.lerp(w.group.rotation.y, target, 0.1);
                }
            });

            // Smoothly interpolate Camera tracking position
            camera.position.lerp(new THREE.Vector3(car.position.x - Math.sin(angle)*9, car.position.y+4.5, car.position.z - Math.cos(angle)*11), 0.1);
            camera.lookAt(car.position);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
